<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planet Crafter Save Editor — unstuck players, items, and chests</title>
    <meta name="description" content="A free, in-browser save editor for The Planet Crafter. Teleport stuck players, containers, vehicles, and dropped items. Edit inventories. No install, no upload — runs entirely in your browser." />
    <link rel="canonical" href="https://nikouu.github.io/Planet-Crafter-Save-Editor/" />
    <meta name="theme-color" content="#c9572b" />

    <meta property="og:title" content="Planet Crafter Save Editor" />
    <meta property="og:description" content="Unstuck players, items, and chests in your Planet Crafter save — entirely in your browser." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nikouu.github.io/Planet-Crafter-Save-Editor/" />
    <meta property="og:image" content="https://github.com/user-attachments/assets/d38fefc5-f5db-4c17-b2e4-09b574520aba" />
    <meta property="og:image:alt" content="Screenshot of the Planet Crafter Save Editor showing teleport and inventory editing controls" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Planet Crafter Save Editor" />
    <meta name="twitter:description" content="Unstuck players, items, and chests in your Planet Crafter save — entirely in your browser." />
    <meta name="twitter:image" content="https://github.com/user-attachments/assets/d38fefc5-f5db-4c17-b2e4-09b574520aba" />

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Planet Crafter Save Editor",
        "url": "https://nikouu.github.io/Planet-Crafter-Save-Editor/",
        "applicationCategory": "UtilityApplication",
        "operatingSystem": "Any (web browser)",
        "description": "A free, in-browser save editor for The Planet Crafter. Teleport stuck players, containers, vehicles, and dropped items. Edit inventories. No install, no upload — runs entirely in your browser.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>

    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link href="PlanetCrafterSaveEditor.styles.css" rel="stylesheet" />
    <script src="js/interop.js"></script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
